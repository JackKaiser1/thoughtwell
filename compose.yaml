services:
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /frontend
          initial_sync: true
          ignore:
            - node_modules/
        - action: rebuild
          path: ./frontend/package.json
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    ports: ["8080:8080"]
    environment:
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}
      - SECRET=${SECRET}
      - API_KEY=${API_KEY}
      - MODE=${MODE}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/api/readiness",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /backend
          initial_sync: true
          ignore:
            - node_modules/
        - action: rebuild
          path: ./backend/package.json
    depends_on:
      postgres_db:
        condition: service_healthy

  postgres_db:
    image: postgres:16.14-alpine
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: 
        [
          "CMD-SHELL", 
          'pg_isready -U 
          "$POSTGRES_USER" -d 
          "$POSTGRES_DB"'
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      minio_db:
        condition: service_healthy

  minio_db:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    healthcheck:
      test:
        [
          "CMD",
          "mc",
          "ready",
          "local",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
